name: Evaluate AeroHealth alerts

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aerohealth-alert-evaluation
  cancel-in-progress: false

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.ALERTS_DATABASE_URL }}
      SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
      DEBUG: "False"
      ALERTS_DRY_RUN: "True"

    steps:
      - name: Validate required secrets
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Add the ALERTS_DATABASE_URL repository secret."
            exit 1
          fi
          if [ -z "$SECRET_KEY" ]; then
            echo "::error::Add the DJANGO_SECRET_KEY repository secret."
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Write Firebase service-account file
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            echo "::error::Add the FIREBASE_SERVICE_ACCOUNT_JSON repository secret."
            exit 1
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/firebase-service-account.json"
          chmod 600 "$RUNNER_TEMP/firebase-service-account.json"
          python -c 'import json, os; json.load(open(os.path.join(os.environ["RUNNER_TEMP"], "firebase-service-account.json")))'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Evaluate and send alerts
        env:
          FIREBASE_SERVICE_ACCOUNT_FILE: ${{ runner.temp }}/firebase-service-account.json
        run: python manage.py evaluate_alerts --send
